<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockPals</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff1ff;--panel:#fff;--ink:#1d2b53;--line:#1d2b53;--dots:#c3d9ec;--trig:#f5c518;--mot:#3b8eea;--look:#9b5de5;--snd:#e8478b;--ctl:#f58a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a33;--panel:#1b2748;--ink:#f1f5ff;--line:#8fa4d8;--dots:#2c3a63}}
:root[data-theme="dark"]{--bg:#101a33;--panel:#1b2748;--ink:#f1f5ff;--line:#8fa4d8;--dots:#2c3a63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(300px,42%) 1fr;grid-template-rows:auto 1fr;gap:10px;padding:10px}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{margin:0;font-size:28px;font-weight:800;flex:1}
.btn{border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;font:inherit;font-size:26px;width:56px;height:52px;cursor:pointer;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.35}
.btn:focus-visible,.tab:focus-visible,.th:focus-visible{outline:4px solid var(--mot);outline-offset:2px}
.go{background:#3ec96b}.stop{background:#ff5a5f}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.stagewrap{border:4px solid var(--line);border-radius:20px;overflow:hidden;background:#000;flex:none}
#stage{position:relative;width:100%;aspect-ratio:4/3;container-type:inline-size;overflow:hidden}
.spr{position:absolute;font-size:15cqw;line-height:1;cursor:grab;transform:translate(-50%,-50%);touch-action:none}
svg{width:1em;height:1em;display:block}
.bub{position:absolute;left:55%;bottom:90%;background:#fff;color:#1d2b53;border:3px solid #1d2b53;border-radius:18px;padding:0 10px;font-size:5.5cqw;white-space:normal;width:max-content;max-width:50cqw;text-align:center;line-height:1.1;font-weight:800}
.tray{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:var(--panel);border:3px solid var(--line);border-radius:18px}
.th{width:60px;height:60px;border:3px solid var(--line);border-radius:14px;background:var(--bg);font-size:34px;position:relative;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.th.sel{background:var(--trig);box-shadow:0 0 0 3px var(--ink)}
.th .x{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:#ff5a5f;color:#fff;font-size:15px;display:grid;place-items:center;border:2px solid var(--line)}
.right{display:flex;flex-direction:column;gap:10px;min-height:0}
.palbox{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{border:3px solid var(--line);border-radius:14px;width:56px;height:44px;font-size:24px;cursor:pointer;background:var(--bg);padding:0}
.tab.on{box-shadow:0 0 0 3px var(--ink)}
#pal{display:flex;flex-wrap:wrap;gap:14px 16px;min-height:64px;padding-left:4px}
#area{flex:1;position:relative;overflow:auto;border:3px solid var(--line);border-radius:18px;background:var(--panel) radial-gradient(var(--dots) 2px,transparent 2px) 0 0/24px 24px;min-height:180px}
.script{position:absolute;display:flex;align-items:center;padding:4px 14px 4px 4px}
/* puzzle pieces: socket on the left, knob on the right */
.blk{--c:var(--mot);position:relative;isolation:isolate;height:56px;min-width:66px;padding:0 14px 0 16px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:30px;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.blk::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--c);border-radius:10px;-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000);mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000)}
.blk::after{content:'';position:absolute;right:-10px;top:calc(50% - 10px);width:20px;height:20px;border-radius:50%;background:var(--c);z-index:-1}
.trig{--c:var(--trig);color:#1d2b53}.mot{--c:var(--mot)}.look{--c:var(--look)}.snd{--c:var(--snd)}.ctl{--c:var(--ctl)}
.blk.trig::before,.inner>.blk:first-child::before{-webkit-mask:none;mask:none}
.blk.trig::before{border-radius:28px 10px 10px 28px}
.num{background:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1d2b53;border-radius:12px;min-width:30px;padding:0 6px;font-size:20px;text-align:center;font-weight:800;cursor:pointer}
.rep{height:auto;min-height:76px;padding:8px 16px 8px 16px;gap:8px}
.hd{display:flex;align-items:center;gap:6px}
.inner{display:flex;align-items:center;min-width:78px;min-height:62px;padding:3px 14px 3px 3px;background:rgba(255,255,255,.4);border-radius:12px}
.inner:empty{outline:3px dashed rgba(255,255,255,.85);outline-offset:-4px}
.float{position:fixed;z-index:30;pointer-events:none;display:flex;align-items:center;opacity:.92}
#ins{position:fixed;width:8px;border-radius:4px;background:#1d2b53;outline:2px solid #fff;z-index:29;display:none;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:40}
.modal.show{display:grid}
.card{background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:16px;max-width:96vw;max-height:92vh;overflow:auto;position:relative}
.grid{display:grid;grid-template-columns:repeat(6,60px);gap:8px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:28px}
.slot b{width:30px}.pv{flex:1;min-width:150px;font-size:24px;display:flex;gap:2px;min-height:34px}.pv svg{width:24px;height:24px}
input{user-select:text;-webkit-user-select:text;touch-action:auto}
#tx{width:min(80vw,360px);font:inherit;font-size:26px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.orph{outline:3px dashed var(--line);outline-offset:1px;border-radius:14px}
.card{touch-action:pan-y}
.art{display:block;line-height:1}
.fx{display:inline-block;transform:scaleX(-1);font-style:normal}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.15em;font-style:normal}
.mk{width:1.4em;height:1.4em;margin:-.2em -.1em}
.spr img{width:1em;height:1em;display:block;pointer-events:none;-webkit-user-drag:none}
.th img{width:44px;height:44px;pointer-events:none}
.pv img{width:24px;height:24px}
#pc{display:block;border:3px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair;background:#fff;width:min(92vw,540px,calc(56vh*1.333))}
#pc.spr{background:repeating-conic-gradient(#e3eaf2 0 25%,#fff 0 50%) 0 0/20px 20px;width:min(82vw,360px,56vh)}
.pf{position:sticky;bottom:0;z-index:5;background:var(--panel);display:flex;justify-content:flex-end;padding-top:10px}
#pc{position:relative;z-index:0}
.pw{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.ps{flex:1;min-width:200px;max-width:300px}
.pt{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.pt .btn{width:48px;height:44px;font-size:22px}
.btn.on{background:var(--trig)}
.pt i{display:block;background:var(--ink);border-radius:50%}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);padding:0;cursor:pointer}
.sw.on{outline:4px solid var(--ink);outline-offset:2px}
.hr{display:flex;align-items:center;gap:14px;margin:14px 0;font-size:20px;line-height:1.2}
.hb{flex:none;width:190px;display:flex;pointer-events:none}
.hp{font-size:20px;line-height:1.6;margin:0}
#cx{z-index:6;position:absolute;top:8px;right:8px;width:40px;height:40px;font-size:18px}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;overflow:auto}header{grid-column:1}body{overflow:auto}.stagewrap{max-width:360px}#area{min-height:260px}}
</style>
</head>

</div>
<div id="ins"></div>
<div class="modal" id="modal"><div class="card"><button class="btn" id="cx" aria-label="Close">✕</button><div id="mc"></div></div></div>

/* rendering: blocks are nested, path "script.index.index" */
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const mkb=t=>{const d=D[t];return{t,...(d.o?{n:t==='snd'?(DEF[cur.e]??6):0}:d.n?{n:d.n}:{}),...(d.k?{k:[]}:{})}};
function bh(b,p){const d=D[b.t],a=p?`data-p="${p}"`:'';
 const num=d.o?`<b class="num">${b.t==='say'&&b.n===5?esc(b.txt||'✏️'):b.t==='snd'?fh(d.o[b.n||0]):d.o[b.n||0]}</b>`:d.n?`<b class="num">${b.n}</b>`:'';
 if(d.k)return `<div class="blk rep ctl" data-t="rep" ${a}><span class="hd"><span>🔁</span>${num}</span><div class="inner" ${p?`data-l="${p}"`:''}>${b.k.map((c,i)=>bh(c,p+'.'+i)).join('')}</div></div>`;
 return `<div class="blk ${d.c}" data-t="${b.t}" ${a}><span>${d.i==='monkey'?MONKEY:d.i==='monkeyh'?MONKEYH:d.i}</span>${num}</div>`}
function renderPal(){$('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i==tab?'on':''}" data-tab="${i}" aria-label="Block group ${i+1}">${t[0]==='🏃'?'<i class="fx">🏃</i>':t[0]}</button>`).join('');$('pal').innerHTML=TABS[tab][1].map(t=>bh(mkb(t),'')).join('')}
function renderScripts(){$('area').innerHTML=cur.scripts.map((s,si)=>`<div class="script${s.b[0]&&!isT(s.b[0].t)?' orph':''}" data-l="${si}" style="left:${s.x}px;top:${s.y}px">${s.b.map((b,i)=>bh(b,si+'.'+i)).join('')}</div>`).join('')}
function renderTray(){$('tray').innerHTML=sprites.map(s=>`<button class="th ${s===cur?'sel':''}" data-sp="${s.id}" aria-label="Character">${th(s)}${s===cur&&sprites.length>1?'<span class="x" data-del="1">✕</span>':''}</button>`).join('')+`<button class="th" id="add" aria-label="Add character or scenery">➕</button>${cur.e.startsWith('data:')?'<button class="th" data-paint="edit" aria-label="Edit drawing">✏️</button>':''}<span style="width:60px;height:60px;flex:none" aria-hidden="true"></span><span style="display:flex;gap:8px;flex:none"><button class="th" id="big" aria-label="Bigger">${GROW}</button><button class="th" id="sm" aria-label="Smaller">${SHRINK}</button>${'<button class="th" id="flip" aria-label="Flip the other way">↔️</button>'}</span>`}
function renderStage(){$('stage').style.background=BG[bgi];$('stage').innerHTML=sprites.map(s=>`<div class="spr" data-id="${s.id}"><span class="art">${sh(s.e)}</span></div>`).join('');sprites.forEach(pos)}
function pos(s){const el=document.querySelector(`.spr[data-id="${s.id}"]`);if(!el)return;
 el.style.left=s.x/4.8+'%';el.style.top=s.y/3.6+'%';el.style.zIndex=s.scn?1:2;el.style.display=s.vis?'':'none';
 el.style.transform=`translate(-50%,-50%) rotate(${s.rot}deg) scale(${s.sc})`;
 const ar=el.querySelector('.art');if(ar)ar.style.transform=`scaleX(${(s.scn?!!s.fl:(s.face!=='l')===!!s.fl)?-1:1})`;
 let b=el.querySelector('.bub');if(s.say){if(!b){b=document.createElement('div');b.className='bub';el.appendChild(b)}b.textContent=s.say;b.style.transform=`rotate(${-s.rot}deg)`}else if(b)b.remove()}

const LS=p=>{const a=p.split('.').map(Number);let L=cur.scripts[a[0]].b;for(const x of a.slice(1))L=L[x].k;return L};

/* running */
function tween(ms,f,g){return new Promise(r=>{const t0=performance.now();(function s(t){if(g!==gen)return r();const k=Math.min(1,(t-t0)/ms);f(k);k<1?requestAnimationFrame(s):r()})(t0)})}
async function act(s,b,g){const S=30,n=b.n;
 const mv=(dx,dy)=>{const x0=s.x,y0=s.y,x1=cl(x0+dx,10,470),y1=cl(y0+dy,10,350);return tween(350,k=>{s.x=x0+(x1-x0)*k;s.y=y0+(y1-y0)*k;pos(s)},g)};
 switch(b.t){
  case 'right':s.face='r';return mv(n*S,0);case 'left':s.face='l';return mv(-n*S,0);case 'up':return mv(0,-n*S);case 'down':return mv(0,n*S);
  case 'cw':case 'ccw':{const r0=s.rot,dr=(b.t=='cw'?1:-1)*n*30;return tween(350,k=>{s.rot=r0+dr*k;pos(s)},g)}
  case 'hop':{const y0=s.y;beep(660,.1);await tween(450,k=>{s.y=y0-Math.sin(k*Math.PI)*34*n;pos(s)},g);s.y=y0;return pos(s)}
  case 'say':{const tx=b.n===5?(b.txt||'✏️'):D.say.o[b.n||0];s.say=tx;pos(s);beep(780,.1);await sleep(Math.max(1000,500+tx.length*90));s.say='';return pos(s)}
  case 'grow':s.sc=Math.min(7,s.sc*1.3);pos(s);return sleep(250);
  case 'shrink':s.sc=Math.max(.3,s.sc/1.3);pos(s);return sleep(250);
  case 'show':s.vis=1;pos(s);return sleep(150);case 'hide':s.vis=0;pos(s);return sleep(150);
  case 'snd':return b.n===9?playRec(b):sleep(snd(b.n||0));
  case 'wait':return sleep(n*500);}}
async function exec(s,bl,g){for(const b of bl){if(g!==gen)return;
 if(b.t==='rep'){for(let k=0;k<b.n;k++){await exec(s,b.k,g);if(g!==gen)return}}
 else if(!isT(b.t))await act(s,b,g)}}
const runAll=(trig,only)=>{const g=gen;(only?[only]:sprites).forEach(s=>s.scripts.forEach(sc=>{if(sc.b[0]&&sc.b[0].t===trig)exec(s,sc.b,g)}))};
const stopAll=()=>{gen++;AUD.forEach(a=>a.pause());AUD.clear();sprites.forEach(s=>{s.say='';pos(s)})};

  const s=inR(e,$('area').getBoundingClientRect())?slot({x:fx+6,y:fy+28},drag.list):null,i=$('ins');
  if(s){i.style.display='block';i.style.left=s.x-4+'px';i.style.top=s.y-s.h/2+'px';i.style.height=s.h+'px'}else i.style.display='none'}});
document.addEventListener('pointerup',e=>{
 if(sd){if(!sd.moved){const s=sd.s;sel(s);runAll('tap',s);beep(500,.06);const el=document.querySelector(`.spr[data-id="${s.id}"]`);if(el)el.animate([{filter:'drop-shadow(0 0 14px #ffd400) brightness(1.3)'},{filter:'none'}],350);if(!s.scripts.some(sc=>sc.b[0]&&sc.b[0].t==='tap')){s.say='🤔';pos(s);setTimeout(()=>{if(s.say==='🤔'){s.say='';pos(s)}},900)}}sd=null;return}
 if(drag){const a=$('area').getBoundingClientRect(),fx=e.clientX-drag.ox,fy=e.clientY-drag.oy;$('ins').style.display='none';
  if(inR(e,a)){const sl=slot({x:fx+6,y:fy+28},drag.list);
   if(sl)LS(sl.l).splice(sl.i,0,...drag.list);
   else cur.scripts.push({x:Math.max(4,fx-a.left+$('area').scrollLeft),y:Math.max(4,fy-a.top+$('area').scrollTop),b:drag.list});
   beep(440,.05)}
  drag.f.remove();drag=null;pend=null;renderScripts();return}
 if(pend){const p=pend;pend=null;
  if(p.num&&!p.pal){const b=BK(p.p),d=D[b.t];
   if(b.t==='snd'&&b.n===9){setTimeout(()=>recUI(b),200);return}
   if(b.t==='say'&&b.n===5){setTimeout(()=>edit(b),200);return}
   if(b.t==='snd')b.n=ORD[(ORD.indexOf(b.n||0)+1)%ORD.length];else if(d.o)b.n=((b.n||0)+1)%d.o.length;else b.n=b.n>=10?(b.t==='rep'?2:1):b.n+1;
   if(b.t==='say'&&b.n===5){renderScripts();setTimeout(()=>edit(b),200);return}
   if(b.t==='snd'&&b.n===9){renderScripts();setTimeout(()=>recUI(b),200);return}
   if(b.t==='snd')snd(b.n);renderScripts()}
  else if(!p.pal)exec(cur,cur.scripts[+p.p.split('.')[0]].b,gen);
  else beep(400,.04)}});

function edit(b){modal(`<div style="padding-top:34px"><p style="margin:0 0 8px;font-size:24px">💬 ✏️</p><input id="tx" maxlength="30" value="${esc(b.txt||'')}" aria-label="Type a message"><div style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="txok" aria-label="Done">✔️</button><button class="btn" id="txback" aria-label="Back to the choices">↩</button></div></div>`);
 const i=$('tx'),ok=()=>{b.txt=i.value.trim();$('modal').classList.remove('show');renderScripts()};
 i.focus();$('txok').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};
 $('txback').onclick=()=>{b.n=0;$('modal').classList.remove('show');renderScripts()}}
const HELP=[['flag','Start when you press the green flag 🏁.'],['tap','Start when you tap the character on the stage.'],['right','Go right and face right. The number is how many steps.'],['left','Go left and face left.'],['up','Go up.'],['down','Go down.'],['cw','Turn to the right.'],['ccw','Turn to the left.'],['hop','Jump up and down!'],['say','Say a word. Tap the word to change it, or pick ✏️ to type your own.'],['grow','Get bigger.'],['shrink','Get smaller.'],['show','Show the character again. The monkey opens its eyes!'],['hide','Hide the character. The monkey covers its eyes.'],['snd','Make a sound. Tap the picture to pick a sound, or pick 🎤 to record your own.'],['wait','Wait a little bit.'],['rep','Do the blocks inside again and again. The number is how many times.']];
function help(){modal(`<div style="padding-top:34px;max-width:600px"><h2 style="margin:0 0 6px">❓ Help</h2><p class="hp">1️⃣ Drag blocks into the big white box.<br>2️⃣ Snap them together like puzzle pieces.<br>3️⃣ Press 🏁 to play!<br>👆 Tap a block to play just that story.<br>🗑 Drag a block out of the box to throw it away.</p><h3>Block groups</h3><p class=\"hp\">🏁 Start blocks<br><i class=\"fx\">🏃</i> Move blocks<br>✨ Looks and sounds<br>🔁 Wait and repeat</p><h3>Blocks</h3>${HELP.map(([t,s])=>`<div class="hr"><div class="hb">${bh(mkb(t),'')}</div><span>${s}</span></div>`).join('')}<h3>Buttons</h3><p class="hp">🏁 Play &nbsp; ⏹ Stop<br>↺ Put everyone back<br>🖼 New background<br>💾 Save, open or delete a project (5 spots)<br>🆕 Start a new project<br>➕ Add a friend, scenery or furniture<br>🎨 (inside ➕) Draw your own character<br>✏️ (by the ➕) Change your drawing<br>🖌 Draw your own background<br><i class=\"ic\">${GROW}</i> <i class=\"ic\">${SHRINK}</i> Make the picked picture bigger or smaller<br>↔️ Flip the picked picture the other way</p></div>`)}
/* drawing */
const COLS=['#1d2b53','#e63946','#f58a1f','#f5c518','#3ec96b','#3b8eea','#9b5de5','#e8478b','#8b5a2b','#ffffff','#8a8a8a','#000000'];
const bgcss=u=>`url(${u}) 0 0/100% 100%`;let P=null;
function flood(x,y,col){const{ctx,cv}=P,W=cv.width,H=cv.height,im=ctx.getImageData(0,0,W,H),d=im.data,i0=(y*W+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],n=parseInt(col.slice(1),16),f=[n>>16,(n>>8)&255,n&255,255];
 if(t.every((v,k)=>v===f[k]))return;
 const seen=new Uint8Array(W*H),st=[[x,y]];
 while(st.length){const[a,b]=st.pop();if(a<0||b<0||a>=W||b>=H||seen[b*W+a])continue;const i=(b*W+a)*4;
  if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])>90)continue;
  seen[b*W+a]=1;d[i]=f[0];d[i+1]=f[1];d[i+2]=f[2];d[i+3]=255;st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}
 ctx.putImageData(im,0,0)}
function paint(kind,spr){const bg=kind==='bg',W=bg?480:240,H=bg?360:240,ed=bg?bgi>=NB:!!spr;
 modal(`<div style="padding-top:34px"><div class="pw"><canvas id="pc" class="${bg?'bg':'spr'}" width="${W}" height="${H}"></canvas><div class="ps"><div class="pt" style="margin-top:0"><button class="btn on" data-tl="pen" aria-label="Pen">✏️</button><button class="btn" data-tl="era" aria-label="Eraser">🧽</button><button class="btn" data-tl="fill" aria-label="Fill">🪣</button><button class="btn" data-sz="3" aria-label="Thin"><i style="width:5px;height:5px"></i></button><button class="btn on" data-sz="8" aria-label="Medium"><i style="width:11px;height:11px"></i></button><button class="btn" data-sz="18" aria-label="Thick"><i style="width:19px;height:19px"></i></button><button class="btn" id="pun" aria-label="Undo">↩</button><button class="btn" id="pcl" aria-label="Clear">🗑</button></div><div class="pt">${COLS.map((c,i)=>`<button class="sw${i?'':' on'}" data-col="${c}" style="background:${c}" aria-label="Color"></button>`).join('')}</div></div></div><div class="pf"><button class="btn go" id="pok" style="width:96px" aria-label="Done">✔️</button></div></div>`);
 const cv=$('pc'),ctx=cv.getContext('2d',{willReadFrequently:true});let last=null;P={cv,ctx,tool:'pen',col:COLS[0],sz:8,hist:[]};
 const url=bg?(ed?BG[bgi].slice(4,BG[bgi].indexOf(')')):null):(spr?spr.e:null);
 if(url){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,W,H);im.src=url}else if(bg){ctx.fillStyle='#9fdcff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#7ed26b';ctx.fillRect(0,H*.62,W,H)}
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]},
 snap=()=>{P.hist.push(ctx.getImageData(0,0,W,H));if(P.hist.length>15)P.hist.shift()},
 seg=(a,b)=>{const er=P.tool==='era';ctx.globalCompositeOperation=er&&!bg?'destination-out':'source-over';ctx.strokeStyle=er&&bg?'#fff':P.col;ctx.lineWidth=P.sz*(er?2:1);ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.globalCompositeOperation='source-over'};
 cv.onpointerdown=e=>{e.preventDefault();const p=pt(e);snap();if(P.tool==='fill'){flood(Math.floor(p[0]),Math.floor(p[1]),P.col);return}cv.setPointerCapture(e.pointerId);last=p;seg(p,[p[0]+.01,p[1]])};
 cv.onpointermove=e=>{if(!last)return;const p=pt(e);seg(last,p);last=p};
 cv.onpointerup=cv.onpointercancel=()=>{last=null};
 const mark=(a,v)=>$('mc').querySelectorAll(`[${a}]`).forEach(b=>b.classList.toggle('on',b.getAttribute(a)==v));
 $('mc').onclick=e=>{if(!P)return;const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tl){P.tool=b.dataset.tl;mark('data-tl',P.tool)}
  else if(b.dataset.sz){P.sz=+b.dataset.sz;mark('data-sz',P.sz)}
  else if(b.dataset.col){P.col=b.dataset.col;mark('data-col',P.col);if(P.tool==='era'){P.tool='pen';mark('data-tl','pen')}}
  else if(b.id==='pun'){const h=P.hist.pop();if(h)ctx.putImageData(h,0,0)}
  else if(b.id==='pcl'){snap();ctx.globalCompositeOperation='source-over';if(bg){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}else ctx.clearRect(0,0,W,H)}
  else if(b.id==='pok'){const u=cv.toDataURL('image/png');
   if(bg){if(ed)BG[bgi]=bgcss(u);else{BG.push(bgcss(u));bgi=BG.length-1}$('stage').style.background=BG[bgi]}
   else if(spr){spr.e=u;all()}
   else{const s=mk(u,240,230);sprites.push(s);cur=s;all()}
   P=null;$('modal').classList.remove('show')}}}
const AUD=new Set();
function playA(src,r){const a=new Audio(src);AUD.add(a);const end=()=>{a.pause();AUD.delete(a);if(r)r()};a.onended=end;a.onerror=end;a.play().catch(end);setTimeout(end,3000);return a}
function playRec(b){if(!b.rec)return sleep(200);return new Promise(r=>playA(b.rec,r))}
function recUI(b){let tmp=b.rec||null,mr=null,st=null;
 modal(`<div style="padding-top:34px;text-align:center"><p style="font-size:64px;margin:0" id="rs">🎤</p><div style="display:flex;gap:12px;justify-content:center;align-items:center;margin-top:10px"><button class="btn" id="rrec" style="width:90px;height:90px;font-size:44px;background:#ff5a5f" aria-label="Record">⏺</button><button class="btn" id="rfile" aria-label="Pick a sound file">📁</button><input type="file" id="rin" accept="audio/*" style="display:none"><button class="btn" id="rpl" aria-label="Play" ${b.rec?'':'disabled'}>▶️</button><button class="btn go" id="rok" aria-label="Done">✔️</button><button class="btn" id="rbk" aria-label="Back to the sounds">↩</button></div><p id="rmsg" style="font-size:18px;min-height:26px">${b.rec?'':'Tap the red button, then make a sound!'}</p></div>`);
 const msg=t=>$('rmsg').textContent=t,ic=e=>$('rs').textContent=e,stop=()=>{if(mr&&mr.state==='recording')mr.stop()};
 $('rrec').onclick=async()=>{if(mr&&mr.state==='recording'){stop();return}
  try{if(!navigator.mediaDevices||!window.MediaRecorder)throw 0;
   st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];mr=new MediaRecorder(st);
   mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());ic('🎤');const fr=new FileReader();fr.onload=()=>{tmp=fr.result;$('rpl').disabled=false;msg('Got it! ✅')};fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
   mr.start();ic('🔴');msg('Recording...');setTimeout(stop,3000)}
  catch(e){msg('Recording is blocked here. Tap 📁 to pick a sound file instead.')}};
 $('rpl').onclick=()=>{if(tmp){AUD.forEach(a=>a.pause());playA(tmp)}};
 $('rfile').onclick=()=>$('rin').click();
 $('rin').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1000000){msg('That sound is too big. Try a shorter one.');return}const fr=new FileReader();fr.onload=()=>{tmp=fr.result;$('rpl').disabled=false;msg('Got it! ✅')};fr.readAsDataURL(f)};
 $('rok').onclick=()=>{if(mr&&mr.state==='recording'){stop();setTimeout(()=>$('rok').click(),500);return}b.rec=tmp;$('modal').classList.remove('show');renderScripts()};
 $('rbk').onclick=()=>{stop();b.n=0;$('modal').classList.remove('show');renderScripts()}}
function newUI(){modal(`<div style="padding-top:34px;text-align:center"><p style="font-size:24px;margin:0 0 12px">🆕 Start a new project?<br><span style="font-size:18px">Anything you did not save will be lost. Your saved projects stay safe.</span></p><div style="display:flex;gap:12px;justify-content:center"><button class="btn go" id="newok" style="width:90px" aria-label="Yes, start new">✔️</button><button class="btn" id="newno" style="width:90px" aria-label="No, keep working">✖️</button></div></div>`);
 $('newok').onclick=()=>{stopAll();BG.length=NB;bgi=0;starter();$('modal').classList.remove('show');all()};
 $('newno').onclick=()=>$('modal').classList.remove('show')}
function rmUI(i){modal(`<div style="padding-top:34px;text-align:center"><p style="font-size:24px;margin:0 0 12px">🗑 Delete saved project ${i+1}?<br><span style="font-size:18px">This cannot be undone.</span></p><div style="display:flex;gap:12px;justify-content:center"><button class="btn go" id="rmok" style="width:90px" aria-label="Yes, delete">✔️</button><button class="btn" id="rmno" style="width:90px" aria-label="No, keep it">✖️</button></div></div>`);
 $('rmok').onclick=()=>{try{const S=slots();S[i]=null;localStorage.setItem(KEY,JSON.stringify(S));saveUI('Deleted.')}catch(e){saveUI('Could not delete.')}};
 $('rmno').onclick=()=>saveUI()}
/* save and open */
const KEY='blockpals-v2';
const slots=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
function modal(h){$('mc').innerHTML=h;$('modal').classList.add('show')}
function saveUI(msg=''){const S=slots();modal(`<div style="padding-top:34px">${[0,1,2,3,4].map(i=>`<div class="slot"><b>${i+1}</b><span class="pv">${S[i]?S[i].sprites.map(s=>fh(s.e)).join(''):''}</span><button class="btn" data-save="${i}" aria-label="Save here">💾</button><button class="btn" data-load="${i}" ${S[i]?'':'disabled'} aria-label="Open">📂</button><button class="btn" data-rm="${i}" ${S[i]?'':'disabled'} aria-label="Delete">🗑</button></div>`).join('')}<p>${msg}</p></div>`)}
function doSave(i){try{const S=slots();S[i]={bgi,bgs:BG.slice(NB),sprites,t:Date.now()};localStorage.setItem(KEY,JSON.stringify(S));saveUI('Saved! ✅')}catch(e){saveUI('Saving does not work in this browser.')}}
function doLoad(i){const s=slots()[i];if(!s)return;stopAll();BG.length=NB;BG.push(...(s.bgs||[]));bgi=Math.min(s.bgi,BG.length-1);sprites.length=0;sprites.push(...s.sprites);sprites.forEach(x=>{if(x.fl===undefined)x.fl=FL.includes(x.e)});uid=Math.max(...sprites.map(x=>x.id))+1;cur=sprites[0];$('modal').classList.remove('show');all()}

/* buttons */
document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let t;
 if(t=g('[data-tab]')){tab=+t.dataset.tab;renderPal();return}
 if(g('[data-del]')){const i=sprites.indexOf(cur);sprites.splice(i,1);cur=sprites[Math.max(0,i-1)];all();return}
 if(t=g('[data-sp]')){sel(sprites.find(x=>x.id==t.dataset.sp));return}
 if(g('#add')){modal(`<div style="padding-top:34px"><button class="th" data-paint="spr" aria-label="Draw my own" style="width:100%;font-size:26px;margin-bottom:10px">🎨 Draw my own</button><div class="grid">${CH.map(c=>`<button class="th" data-em="${c}" aria-label="Add character">${fh(c)}</button>`).join('')}</div><div class="grid">${SC.map(c=>`<button class="th" data-em="${c}" data-sc="1" aria-label="Add scenery">${sh(c)}</button>`).join('')}</div><div class="grid">${FU.map(c=>`<button class="th" data-em="${c}" data-sc="1" aria-label="Add furniture">${c}</button>`).join('')}</div></div>`);return}
 if(t=g('[data-em]')){const sc=!!t.dataset.sc,s=mk(t.dataset.em,60+Math.random()*360,sc?(/☀|☁|🌈/.test(t.dataset.em)?60:198):240,sc);sprites.push(s);$('modal').classList.remove('show');cur=s;all();return}
 if(t=g('[data-paint]')){paint(t.dataset.paint,t.dataset.paint==='edit'?cur:null);return}
 if(g('#big')){cur.sc0=cl(cur.sc0*1.25,.4,7);cur.sc=cur.sc0;pos(cur);return}
 if(g('#flip')){cur.fl=!cur.fl;pos(cur);renderTray();return}
 if(g('#sm')){cur.sc0=cl(cur.sc0/1.25,.4,7);cur.sc=cur.sc0;pos(cur);return}
 if(t=g('[data-rm]')){rmUI(+t.dataset.rm);return}
 if(t=g('[data-save]')){doSave(+t.dataset.save);return}
 if(t=g('[data-load]')){doLoad(+t.dataset.load);return}
 if(g('#cx')||(e.target===$('modal')&&!P)){P=null;$('modal').classList.remove('show')}});
$('flag').onclick=()=>{gen++;AUD.forEach(a=>a.pause());AUD.clear();sprites.forEach(s=>{s.say='';pos(s)});runAll('flag');beep(600,.08)};
$('stop').onclick=stopAll;
$('reset').onclick=()=>{stopAll();sprites.forEach(s=>{s.x=s.x0;s.y=s.y0;s.rot=0;s.sc=s.sc0;s.vis=1;s.face='r';pos(s)})};
$('bg').onclick=()=>{bgi=(bgi+1)%BG.length;$('stage').style.background=BG[bgi]};
$('save').onclick=()=>saveUI();$('help').onclick=help;$('pbg').onclick=()=>paint('bg');$('newp').onclick=newUI;
all();
</script>
